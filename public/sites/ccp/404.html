<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages has no server-side rewrite — it serves this 404.html
      // (found by walking up from the requested path) for any nested route
      // that has no matching physical file, e.g. /sites/ccp/departments/science.
      // This repackages the real path into a query string on index.html;
      // the decode script in index.html's <head> restores it via
      // history.replaceState before the app renders, so React Router still
      // sees the correct URL. Classic https://github.com/rafgraph/spa-github-pages
      // trick, adapted for a site living under /sites/ccp/.
      var pathSegmentsToKeep = 2;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
